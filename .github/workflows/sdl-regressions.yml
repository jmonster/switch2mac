name: SDL integration regressions
on:
  push:
    branches: [test/integration-closeout-20260909]
permissions:
  contents: read
jobs:
  sdl:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: libsdl-org/SDL
          ref: 147a8ee32dbf9ac02f3794964490687b6bbda1bc
          path: .ci-sdl
          persist-credentials: false
      - name: Ensure the real wired driver is compiled
        run: brew list libusb >/dev/null 2>&1 || brew install libusb
      - name: Compile corrected SDL and test its real UDP path
        run: |
          bash sdl/build-sdl.sh .ci-sdl > "$RUNNER_TEMP/sdl-build.log" 2>&1 || { tail -80 "$RUNNER_TEMP/sdl-build.log"; exit 1; }
          git -C .ci-sdl apply "$GITHUB_WORKSPACE/sdl/sdl3-3.4.14-s2udp.patch"
          git -C .ci-sdl apply "$GITHUB_WORKSPACE/sdl/s2usb-device-identity.patch"
          bash tests/sdl-usb/check-sdl.sh .ci-sdl after
          cc -I .ci-sdl/include tests/sdl-edges/check.c -L build/sdl -Wl,-rpath,"$GITHUB_WORKSPACE/build/sdl" -lSDL3.0 -o "$RUNNER_TEMP/check-edges"
          "$RUNNER_TEMP/check-edges"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sdl-integration-diagnostics
          path: ${{ runner.temp }}/sdl-build.log
          retention-days: 7
